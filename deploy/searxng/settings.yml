use_default_settings:
  engines:
    keep_only:
      # Video discovery (SEARXNG_ENGINES). Each was checked to return results from this image on 2026-09-16;
      # vimeo (HTTP errors) and rumble (no results) were left out.
      - youtube
      - dailymotion
      - sepiasearch
      - odysee
      - bing videos
      - google videos
      - duckduckgo videos
      - brave.videos
      - wikicommons.videos
      # Web page discovery (SEARXNG_WEB_ENGINES) and replacement-domain searches (SEARXNG_SOURCE_ENGINES).
      # Checked on 2026-09-16; duckduckgo (CAPTCHA), qwant (access denied) and mojeek (no results) were left out.
      - google
      - bing
      - brave
      - yahoo
      # Image discovery (SEARXNG_IMAGE_ENGINES). Checked on 2026-09-18. Left out: qwant images
      # (inherits a network from the base qwant engine, which is not kept — SearXNG refuses to
      # boot with KeyError: 'qwant') and reddit (no engine module ships in this build). Reddit
      # and Pinterest images still arrive through the general image engines, which index them.
      - bing images
      - google images
      - duckduckgo images
      - brave.images
      # Deep dives only (SEARXNG_DEEP_ENGINES, SEARXNG_DEEP_WEB_ENGINES): sources ordinary searches rarely reach.
      # Checked with four test queries on 2026-09-17. Left out: niconico, vimeo, tusksearch (HTTP errors), mojeek,
      # fireball, tootfinder (access denied), seznam, mwmbl (timeouts), ina, mediathekviewweb, lemmy communities
      # (no results), boardreader, lemmy posts, media.ccc.de (off-topic results), sogou videos (links to its own
      # redirect pages), iqiyi (weak matches) and yacy (adult results despite safe search).
      - bilibili
      - acfun
      - privacywall videos
      - yep
      - resulthunter
      - privacywall
      - hackernews
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  # Most engines answer in 4-8 seconds; the app requests a per-search limit up to max_request_timeout.
  request_timeout: 8.0
  max_request_timeout: 12.0
engines:
  - name: youtube
    disabled: false
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: bilibili
    disabled: false
  - name: acfun
    disabled: false
  - name: privacywall videos
    disabled: false
  - name: yep
    disabled: false
  - name: resulthunter
    disabled: false
  - name: privacywall
    disabled: false
  - name: hackernews
    disabled: false
  - name: bing images
    disabled: false
  - name: google images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: brave.images
    disabled: false
