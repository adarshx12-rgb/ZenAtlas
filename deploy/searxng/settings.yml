use_default_settings:
  engines:
    keep_only:
      # Video discovery (SEARXNG_ENGINES). Each was checked to return results from this image on 2026-09-16;
      # vimeo (HTTP errors) and rumble (no results) were left out.
      - youtube
      - dailymotion
      - sepiasearch
      - odysee
      - bing videos
      - google videos
      - duckduckgo videos
      - brave.videos
      - wikicommons.videos
      # Web page discovery (SEARXNG_WEB_ENGINES) and replacement-domain searches (SEARXNG_SOURCE_ENGINES).
      # Checked on 2026-09-16; duckduckgo (CAPTCHA), qwant (access denied) and mojeek (no results) were left out.
      - google
      - bing
      - brave
      - yahoo
      # Image discovery (SEARXNG_IMAGE_ENGINES). Checked on 2026-09-18. Left out: qwant images
      # (inherits a network from the base qwant engine, which is not kept — SearXNG refuses to
      # boot with KeyError: 'qwant') and reddit (no engine module ships in this build). Reddit
      # and Pinterest images still arrive through the general image engines, which index them.
      - bing images
      - google images
      - duckduckgo images
      # Deep dives only (SEARXNG_DEEP_ENGINES, SEARXNG_DEEP_WEB_ENGINES): sources ordinary searches rarely reach.
      # Checked with four test queries on 2026-09-17. Left out: niconico, vimeo, tusksearch (HTTP errors), mojeek,
      # fireball, tootfinder (access denied), seznam, mwmbl (timeouts), ina, mediathekviewweb, lemmy communities
      # (no results), boardreader, lemmy posts, media.ccc.de (off-topic results), sogou videos (links to its own
      # redirect pages), iqiyi (weak matches) and yacy (adult results despite safe search).
      - bilibili
      - acfun
      - privacywall videos
      - yep
      - resulthunter
      - privacywall
      - hackernews
      # Added 2026-10-02 after one test search each on a trial instance of this image; Google was dropped from the .env
      # lists because it answered almost every request with a CAPTCHA (28 blocks in 5 days). Left out: findfiles (files
      # from open directories, including .exe downloads), wiby, reloado, encyclosearch, searchch and picjumbo (off-topic),
      # duckduckgo (CAPTCHA; duckduckgo web works), fireball, zapmeta, fastbot, searchmysite (access denied), vimeo,
      # reuters, library of congress, 500px, 360search videos (errors), and engines that do not load without extra
      # setup (startpage, dogpile, swisscows, marginalia, metacrawler, deviantart, core.ac.uk, yahoo news, openclipart).
      - peertube
      - duckduckgo web
      - github
      - stackoverflow
      - vuhuv
      - 360search
      - bing news
      - duckduckgo news
      - wikinews
      - pixabay images
      - unsplash
      - pexels
      - flickr
      - wikicommons.images
      - stocksnap
      - ipernity
      # Images, added 2026-10-03 after three test searches each (plus overlap with Brave and a safe-search check) on a
      # trial instance of this image. yandex images runs a patched module (engines/yandex.py) with Yandex's family filter
      # on; unpatched it returned adult sites. yandex is kept only because yandex images inherits its network. Left out:
      # luxxle and resulthunter images (89-100% the same results as the Brave API), baidu and vuhuv images (adult results
      # despite safe search), quark and naver images (no safe search; shopping and stock-agency results), qwant and startpage
      # images (CAPTCHA), privacywall and dogpile images (access denied), sogou, mojeek and tonline images (no results),
      # tusksearch, swisscows, startpagina, library of congress, public domain image archive, 500px, 1x and giphy (errors),
      # imgur (few results), artic and searchrockit (off-topic), artstation (off-topic concept art) and brave.images (errors;
      # the app asks the Brave API directly).
      - yandex images
      - yandex
      - pinterest
      - deviantart
      # Docs tab research engines (SEARXNG_DOC_ENGINES), asked with the plain query.
      - crossref
      - pubmed
      - europepmc
      - openalex
      - openairepublications
      - openlibrary
      - wikibooks
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  # Most engines answer in 4-8 seconds; the app requests a per-search limit up to max_request_timeout.
  request_timeout: 8.0
  max_request_timeout: 12.0
